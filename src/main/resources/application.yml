spring:
  profiles:
    active: dev  # 激活开发环境配置
    mvc:
      pathmatch:
        matching-strategy: ant_path_matcher  # 关键配置：兼容 Swagger 2.x
  datasource:
    url: jdbc:mysql://localhost:3306/lixiaoyue?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root  # 你的MySQL用户名
    password: root  # 你的MySQL密码
    driver-class-name: com.mysql.cj.jdbc.Driver

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml  # Mapper.xml文件路径（若需）
  type-aliases-package: com.lixiaoyue.model.entity  # 实体类别名包
  configuration:
    map-underscore-to-camel-case: true  # 下划线转驼峰
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 打印SQL日志

# 服务器配置
server:
  port: 8080  # 项目端口
  servlet:
    context-path: /api  # 接口前缀（所有接口需加 /api）
    spring:
      datasource:
        url: jdbc:mysql://localhost:3306/lixiaoyue?serverTimezone=UTC&useUnicode=true&characterEncoding=utf-8&useSSL=false
        driver-class-name: com.mysql.cj.jdbc.Driver
        username: root
        password: root
    # 自动建表核心配置
    mybatis:
      table:
        auto: update  # 建表策略，update为更新表结构
      model:
        pack: com.lixiaoyue.model.entity  # 扫描实体类的包路径
      database:
        type: mysql  # 数据库类型，仅支持MySQL
    # MyBatis - Plus相关配置（若用原生MyBatis可省略）
    mybatis-plus:
      mapper-locations: classpath*:com/gitee/sunchenbin/mybatis/actable/mapping/*/*.xml

    springdoc:
      api-docs:
        path: /api-docs  # 接口文档JSON数据地址（默认即可）
      swagger-ui:
        path: /swagger-ui.html  # 可视化UI地址（默认即可）
        operationsSorter: method  # 接口排序方式（按请求方法排序）
      openapi:
        info:
          title: 理小阅 后端项目 - API 文档（SpringDoc）
          description: 基于 Spring Boot 2.7.x + SpringDoc OpenAPI 3 的接口文档，包含用户管理核心功能
          version: 1.0.0
          contact:
            name: Patrick
            email: wy_zhoujianli@163.com
